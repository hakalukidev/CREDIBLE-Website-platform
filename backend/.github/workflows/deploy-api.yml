name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - 'render.yaml'

jobs:
  deploy-api:
    name: Build & deploy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }

      - run: npm ci
      - run: npm run db:generate
      - run: npm run build

      # Example: deploy to a VM via SSH. Swap with your platform (Fly.io, Render, ECS, etc.)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: dist

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: echo "🚧 Replace this step with your deployment target (Docker image push, SSH, etc.)"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}