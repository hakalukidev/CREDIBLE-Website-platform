name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'public/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'

jobs:
  deploy-web:
    name: Build & deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }

      - run: npm ci
      - run: npm run build

      # Vercel example — replace with your platform
      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: echo "🚧 Replace this step with `vercel deploy --prod` or your CI integration."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}